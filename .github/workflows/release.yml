name: Release

# Publishes a GitHub Release when a version tag (v0.2.0, v0.3.0, …) is pushed.
# The tag is the trigger; nothing publishes on an ordinary push to main.
#
# Produces three downloads:
#   * a signed MSIX (win-arm64) — the demo build including the Windows on-device
#     (NPU) engine. Because it is signed by Azure Artifact Signing, recipients
#     install it by double-clicking; Developer Mode is NOT required.
#   * a signed portable zip (win-arm64) — no install, no NPU engine, and runs on
#     any ARM64 Windows machine.
#   * a signed portable zip (win-x64) — EXPERIMENTAL and unverified: no x64
#     machine exists to test it on, so it is built, architecture-checked, and
#     signed by CI but never smoke-tested. There is deliberately no x64 MSIX.
#
# Signing mirrors QuickMail's proven setup: GitHub OIDC → azure/login → Azure
# Artifact Signing, with no certificate or long-lived secret stored anywhere.
# It needs three repository secrets — AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID — and an Azure federated credential trusting the subject
# repo:kellylford/LiveCaptionsWithAccessibility:environment:azure-signing.
# If the secrets are absent the workflow still publishes, unsigned, and says so.

# Run it manually (Actions ▸ Release ▸ Run workflow) to build and sign WITHOUT
# publishing anything: the artifacts are attached to the run so you can download
# them and confirm the signature. Use that to prove signing works before tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to create the release
  id-token: write   # OIDC token azure/login exchanges for Azure credentials

jobs:
  release:
    # The signing action runs only on windows-2022/2025 (never on ARM64 runners —
    # cross-publishing win-arm64 from an x64 runner is fine and is what we do).
    runs-on: windows-2025

    # Runs in the `azure-signing` environment so the OIDC token's subject is
    # repo:<owner>/<repo>:environment:azure-signing, which the Azure federated
    # credential trusts (wildcard tag subjects aren't supported in this tenant).
    # This is ONLY a claim-matching mechanism, not a deployment gate — do not add
    # protection rules to this environment or every release will await approval.
    environment: azure-signing

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # On a tag the tag is the single source of truth for the version, and it must
      # match the csproj <Version> so a published build can never mis-report itself.
      # On a manual run there is no tag, so the csproj version is used as-is.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $value = (Select-Xml -Path AccessibleLiveCaptions.csproj `
                      -XPath "/Project/PropertyGroup/Version").Node.InnerText
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($tag -ne $value) {
              throw "Tag version '$tag' does not match csproj <Version> '$value'. Update the csproj or re-tag."
            }
            Write-Host "Tag $tag matches csproj <Version>."
          } else {
            Write-Host "Manual run - building version $value without publishing a release."
          }
          "version=$value" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Decide whether signing is configured
        id: signing
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $ok = [bool]$env:CLIENT_ID
          "enabled=$($ok.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          if (-not $ok) {
            Write-Warning "AZURE_CLIENT_ID not set - publishing UNSIGNED artifacts. The MSIX will then only install on machines with Developer Mode enabled."
          }

      # ---- Portable build (no Windows AI flavor) -----------------------------
      - name: Publish portable (self-contained, win-arm64)
        run: >
          dotnet publish AccessibleLiveCaptions.csproj
          --configuration Release
          --runtime win-arm64
          --self-contained true
          --output publish-portable

      # ---- Experimental x64 portable -----------------------------------------
      # Only the sherpa native runtime package is architecture-pinned; it tracks
      # $(RuntimeIdentifier) in the csproj, so the RID switch is the whole change.
      # UNVERIFIED ON REAL HARDWARE - no x64 Copilot+ machine exists to test on.
      # No MSIX for x64: the NPU engine would need packaging that cannot be
      # validated here, and shipping an untestable installer is worse than none.
      - name: Publish portable (self-contained, win-x64, experimental)
        run: >
          dotnet publish AccessibleLiveCaptions.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish-portable-x64

      # ---- MSIX build (Windows AI flavor: adds the NPU engine) ---------------
      # WindowsAppSDKSelfContained puts the Windows App SDK runtime inside the
      # package, so recipients need no separate SDK install.
      - name: Publish MSIX payload (Windows AI flavor, win-arm64)
        run: >
          dotnet publish AccessibleLiveCaptions.csproj
          --configuration Release
          --runtime win-arm64
          --self-contained false
          -p:WindowsAI=true
          -p:WindowsAppSDKSelfContained=true
          --output publish-msix

      - name: Assemble MSIX layout
        shell: pwsh
        run: |
          Copy-Item packaging/Assets publish-msix -Recurse -Force
          $manifest = "publish-msix/AppxManifest.xml"
          Copy-Item packaging/Package.appxmanifest $manifest -Force

          # MSIX requires a four-part version; the tag remains the source of truth.
          # Publisher is NOT stamped here - it lives in the manifest and must stay
          # character-identical to the signing certificate's subject (mismatch =
          # error 0x8007000b at signing time).
          [xml]$xml = Get-Content $manifest
          $xml.Package.Identity.Version = '${{ steps.version.outputs.version }}' + '.0'
          $xml.Save((Resolve-Path $manifest))
          Write-Host "Identity: $($xml.Package.Identity.Name) $($xml.Package.Identity.Version) / $($xml.Package.Identity.Publisher)"

      # azure/login exchanges the workflow OIDC token for Azure credentials; the
      # signing action then authenticates through that session. No certificate or
      # long-lived secret is stored.
      - name: Azure login (code signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sign the payload executables BEFORE packing, so the portable zip's exe is
      # trusted and nothing inside the package ships unsigned.
      - name: Sign application binaries
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kellylford
          certificate-profile-name: kellyford-public
          files: |
            ${{ github.workspace }}\publish-portable\AccessibleLiveCaptions.exe
            ${{ github.workspace }}\publish-portable-x64\AccessibleLiveCaptions.exe
            ${{ github.workspace }}\publish-msix\AccessibleLiveCaptions.exe
          file-digest: SHA256
          # Timestamping is required in practice: Artifact Signing certificates are
          # short-lived, and without a timestamp signatures stop validating in days.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack MSIX
        shell: pwsh
        run: |
          # makeappx ships with the Windows SDK; pick the newest x64 copy on the runner.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object FullName -like "*\x64\*" |
            Sort-Object { $_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found on the runner." }
          Write-Host "Using $($makeappx.FullName)"

          $msix = "AccessibleLiveCaptions-v${{ steps.version.outputs.version }}-win-arm64.msix"
          & $makeappx.FullName pack /d publish-msix /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed." }
          "MSIX=$msix" | Out-File $env:GITHUB_ENV -Append

      # The package signature must be applied AFTER packing: it covers the whole
      # package, so any later edit to the layout would invalidate it.
      - name: Sign MSIX package
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kellylford
          certificate-profile-name: kellyford-public
          files: ${{ github.workspace }}\${{ env.MSIX }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package portable zips
        shell: pwsh
        run: |
          $zip = "AccessibleLiveCaptions-v${{ steps.version.outputs.version }}-win-arm64-portable.zip"
          Compress-Archive -Path publish-portable/* -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

          $zip64 = "AccessibleLiveCaptions-v${{ steps.version.outputs.version }}-win-x64-portable-EXPERIMENTAL.zip"
          Compress-Archive -Path publish-portable-x64/* -DestinationPath $zip64 -Force
          "ZIP_X64=$zip64" | Out-File $env:GITHUB_ENV -Append

      # Report what the signature actually says, so a dry run proves signing end to
      # end rather than merely not failing.
      - name: Verify signatures
        shell: pwsh
        run: |
          foreach ($f in @($env:MSIX, $env:ZIP_EXE, $env:ZIP_EXE_X64)) {
            if (-not $f) { continue }
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f`n  status:  $($sig.Status)`n  subject: $($sig.SignerCertificate.Subject)"
          }
        env:
          ZIP_EXE: publish-portable\AccessibleLiveCaptions.exe
          ZIP_EXE_X64: publish-portable-x64\AccessibleLiveCaptions.exe

      # The x64 flavor differs from arm64 by one MSBuild property, so a typo would
      # silently ship arm64 binaries in an "x64" zip. Assert the PE machine type of
      # the apphost and of the architecture-pinned sherpa native instead of trusting it.
      - name: Verify architecture of each portable build
        shell: pwsh
        run: |
          function Get-PEMachine($p) {
            $fs = [IO.File]::OpenRead($p); $br = New-Object IO.BinaryReader($fs)
            $fs.Position = 0x3C; $off = $br.ReadInt32(); $fs.Position = $off + 4
            $m = $br.ReadUInt16(); $br.Close()
            switch ($m) { 0x8664 {'x64'} 0xAA64 {'ARM64'} 0x14C {'x86'} default {'0x{0:X}' -f $m} }
          }
          $expect = @{ 'publish-portable' = 'ARM64'; 'publish-portable-x64' = 'x64' }
          foreach ($dir in $expect.Keys) {
            foreach ($f in @('AccessibleLiveCaptions.exe','sherpa-onnx-c-api.dll','onnxruntime.dll')) {
              $path = Join-Path $dir $f
              if (-not (Test-Path $path)) { throw "$path is missing from the publish output." }
              $actual = Get-PEMachine $path
              Write-Host ("{0,-24} {1,-24} {2}" -f $dir, $f, $actual)
              if ($actual -ne $expect[$dir]) {
                throw "$path is $actual but $dir must be $($expect[$dir])."
              }
            }
          }

      # Manual runs stop here: the artifacts are attached to the run for inspection
      # and nothing is published.
      - name: Upload artifacts (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleLiveCaptions-v${{ steps.version.outputs.version }}
          path: |
            ${{ env.MSIX }}
            ${{ env.ZIP }}
            ${{ env.ZIP_X64 }}
          if-no-files-found: error
          retention-days: 14

      # Release notes come from docs/release-notes-<tag>.md (e.g. release-notes-v0.2.0.md).
      # fail_on_unmatched_files makes a missing asset fail the release rather than
      # publish an incomplete one.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Accessible Live Captions ${{ github.ref_name }}
          body_path: docs/release-notes-${{ github.ref_name }}.md
          files: |
            ${{ env.MSIX }}
            ${{ env.ZIP }}
            ${{ env.ZIP_X64 }}
          fail_on_unmatched_files: true
